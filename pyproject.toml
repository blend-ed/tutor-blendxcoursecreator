# https://packaging.python.org/en/latest/tutorials/packaging-projects/
# https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-blendxcoursecreator"
description = "This plugin includes the necessary settings for the Blend-ed AI Course Creator"
authors = [
  { name = "Zameel Hassan"},
  { email = "zameel@blend-ed.com" },
]
license = { text = "AGPL-3.0-only" }

readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">= 3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",

]
dependencies = [
    "tutor>=18.0.0,<21.0.0",
]
optional-dependencies = { dev = ["tutor[dev]>=20.0.0,<21.0.0"] }

# These fields will be set by hatch_build.py
dynamic = ["version"]

[tool.hatch.version]
path = "blendxcoursecreator/__about__.py"

# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
[project.urls]
Documentation = "https://github.com/blend-ed/tutor-blendxcoursecreator#readme"
Issues = "https://github.com/blend-ed/tutor-blendxcoursecreator/issues"
Source = "https://github.com/blend-ed/tutor-blendxcoursecreator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blendxcoursecreator"]

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = [ "/blendxcoursecreator"]
exclude = ["tests*"]

[project.entry-points."tutor.plugin.v1"]
blendxcoursecreator = "blendxcoursecreator.plugin"
